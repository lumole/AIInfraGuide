<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">JAX 到 XLA 后端的编译路径</title>
  <desc id="desc">Python 函数经过 tracing、jaxpr、StableHLO、XLA HLO 优化和设备后端，最终生成可执行文件并由 profiler 验证。</desc>
  <rect width="1200" height="540" fill="#f8fafc"/>
  <defs>
    <marker id="xla-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <text x="55" y="52" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#111827">从 JAX 程序到设备可执行文件</text>
  <text x="55" y="84" font-family="system-ui, sans-serif" font-size="17" fill="#475569">四个观察点：trace、lowered IR、optimized HLO、最终执行</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="45" y="150" width="190" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="188" font-size="19" font-weight="600" fill="#1e3a8a">JAX / 前端</text>
    <text x="140" y="226" font-family="ui-monospace, monospace" font-size="16" fill="#1e40af">Python function</text>
    <text x="140" y="256" font-family="ui-monospace, monospace" font-size="16" fill="#1e40af">jaxpr / tracing</text>

    <rect x="285" y="150" width="190" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="188" font-size="19" font-weight="600" fill="#14532d">StableHLO</text>
    <text x="380" y="226" font-size="16" fill="#166534">稳定交换语义</text>
    <text x="380" y="256" font-size="16" fill="#166534">shape / op / attr</text>

    <rect x="525" y="150" width="190" height="150" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="620" y="188" font-size="19" font-weight="600" fill="#9a3412">XLA HLO</text>
    <text x="620" y="226" font-size="16" fill="#9a3412">fusion / layout</text>
    <text x="620" y="256" font-size="16" fill="#9a3412">buffer / collective</text>

    <rect x="765" y="150" width="190" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="860" y="188" font-size="19" font-weight="600" fill="#4c1d95">设备后端</text>
    <text x="860" y="226" font-size="16" fill="#5b21b6">CPU / GPU / TPU</text>
    <text x="860" y="256" font-size="16" fill="#5b21b6">kernel / library</text>

    <rect x="1005" y="150" width="150" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1080" y="188" font-size="19" font-weight="600" fill="#78350f">Executable</text>
    <text x="1080" y="226" font-size="16" fill="#92400e">compile cache</text>
    <text x="1080" y="256" font-size="16" fill="#92400e">device run</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#xla-arrow)">
    <line x1="237" y1="225" x2="280" y2="225"/><line x1="477" y1="225" x2="520" y2="225"/>
    <line x1="717" y1="225" x2="760" y2="225"/><line x1="957" y1="225" x2="1000" y2="225"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="140" y="385" width="920" height="74" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="600" y="414" font-size="18" font-weight="600" fill="#1f2937">Profiler / dump 回看</text>
    <text x="600" y="442" font-size="16" fill="#334155">kernel 数、库调用、copy、同步与异步完成时间，不能从高层 operation 名称猜测</text>
  </g>
  <g stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#xla-arrow)">
    <path d="M1080 302 C1080 350 1020 370 1000 384"/><path d="M200 385 C170 365 140 340 140 302"/>
  </g>
  <text x="55" y="505" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">据 JAX JIT/AOT 文档与 OpenXLA 架构说明重绘；实际 IR 和 pass 会随版本及目标设备变化。</text>
</svg>
