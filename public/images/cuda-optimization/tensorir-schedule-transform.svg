<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">TensorIR 调度变换</title>
  <desc id="desc">一个串行循环经过 split、bind 和 cache 逐步映射到 GPU block、thread 和 shared memory。</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <defs>
    <marker id="tir-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <text x="55" y="52" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#111827">TensorIR Schedule：每个 primitive 都应留下可检查的 IR</text>
  <text x="55" y="84" font-family="system-ui, sans-serif" font-size="17" fill="#475569">示意：逐元素程序从串行循环走向 GPU 映射</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="50" y="155" width="225" height="190" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="162" y="190" font-size="19" font-weight="600" fill="#1f2937">原始 PrimFunc</text>
    <text x="162" y="230" font-family="ui-monospace, monospace" font-size="16" fill="#334155">for i in N</text>
    <text x="162" y="262" font-family="ui-monospace, monospace" font-size="16" fill="#334155">C[i] = A[i] + B[i]</text>
    <text x="162" y="315" font-size="14" fill="#475569">计算正确，但未映射 GPU</text>

    <rect x="345" y="155" width="225" height="190" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="457" y="190" font-size="19" font-weight="600" fill="#1e3a8a">split</text>
    <text x="457" y="230" font-family="ui-monospace, monospace" font-size="16" fill="#1e40af">io, ii = split(i)</text>
    <text x="457" y="262" font-family="ui-monospace, monospace" font-size="16" fill="#1e40af">factor = 128</text>
    <text x="457" y="315" font-size="14" fill="#1d4ed8">得到外层 tile 与块内索引</text>

    <rect x="640" y="155" width="225" height="190" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="752" y="190" font-size="19" font-weight="600" fill="#14532d">bind</text>
    <text x="752" y="230" font-family="ui-monospace, monospace" font-size="16" fill="#166534">io → blockIdx.x</text>
    <text x="752" y="262" font-family="ui-monospace, monospace" font-size="16" fill="#166534">ii → threadIdx.x</text>
    <text x="752" y="315" font-size="14" fill="#15803d">显式映射 GPU 执行层次</text>

    <rect x="935" y="155" width="225" height="190" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="1047" y="190" font-size="19" font-weight="600" fill="#9a3412">cache / vectorize</text>
    <text x="1047" y="230" font-family="ui-monospace, monospace" font-size="16" fill="#9a3412">shared / local</text>
    <text x="1047" y="262" font-family="ui-monospace, monospace" font-size="16" fill="#9a3412">aligned load/store</text>
    <text x="1047" y="315" font-size="14" fill="#c2410c">资源约束必须实测</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#tir-arrow)">
    <line x1="277" y1="250" x2="340" y2="250"/><line x1="572" y1="250" x2="635" y2="250"/><line x1="867" y1="250" x2="930" y2="250"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    <rect x="220" y="398" width="760" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="425" font-weight="600" fill="#4c1d95">每一步都检查：变换后 IR → 生成代码 → 正确性 → profiler</text>
    <text x="600" y="448" fill="#5b21b6">Schedule 变换本身不是性能结论</text>
  </g>
  <text x="55" y="500" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">据 Apache TVM TensorIR Creation 与 Transformation 教程重绘。</text>
</svg>
