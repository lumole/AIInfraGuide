<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">PagedAttention 的逻辑块到物理块映射</title>
  <desc id="desc">逻辑 token 被分成三个块，块表把它们映射到物理块 7、2、5。</desc>
  <rect width="1200" height="610" fill="#f8fafc"/>
  <defs>
    <marker id="arrow-paged" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="55" y="52" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#111827">PagedAttention：逻辑连续，物理可以离散</text>
  <text x="55" y="84" font-family="system-ui, sans-serif" font-size="17" fill="#475569">block_size = 4，序列长度 = 10，block_table = [7, 2, 5]</text>

  <text x="55" y="145" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">逻辑 token 序列</text>
  <g font-family="ui-monospace, monospace" font-size="17" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="55" y="165" width="64" height="58"/><rect x="119" y="165" width="64" height="58"/><rect x="183" y="165" width="64" height="58"/><rect x="247" y="165" width="64" height="58"/>
    </g>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="335" y="165" width="64" height="58"/><rect x="399" y="165" width="64" height="58"/><rect x="463" y="165" width="64" height="58"/><rect x="527" y="165" width="64" height="58"/>
    </g>
    <g fill="#ffedd5" stroke="#ea580c" stroke-width="2">
      <rect x="615" y="165" width="64" height="58"/><rect x="679" y="165" width="64" height="58"/>
    </g>
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5">
      <rect x="743" y="165" width="64" height="58"/><rect x="807" y="165" width="64" height="58"/>
    </g>
    <g fill="#111827">
      <text x="87" y="201">0</text><text x="151" y="201">1</text><text x="215" y="201">2</text><text x="279" y="201">3</text>
      <text x="367" y="201">4</text><text x="431" y="201">5</text><text x="495" y="201">6</text><text x="559" y="201">7</text>
      <text x="647" y="201">8</text><text x="711" y="201">9</text><text x="775" y="201">—</text><text x="839" y="201">—</text>
    </g>
  </g>

  <text x="55" y="292" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Block Table</text>
  <g font-family="ui-monospace, monospace" font-size="18" text-anchor="middle">
    <rect x="55" y="312" width="180" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="335" y="312" width="180" height="62" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="615" y="312" width="180" height="62" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="145" y="350" fill="#1e3a8a">logical 0 → 7</text>
    <text x="425" y="350" fill="#14532d">logical 1 → 2</text>
    <text x="705" y="350" fill="#9a3412">logical 2 → 5</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow-paged)">
    <path d="M183 225 L145 310"/><path d="M463 225 L425 310"/><path d="M711 225 L705 310"/>
  </g>

  <text x="55" y="444" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">全局物理 KV Block 池</text>
  <g font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5">
      <rect x="55" y="465" width="106" height="62" rx="5"/><rect x="179" y="465" width="106" height="62" rx="5"/>
      <rect x="427" y="465" width="106" height="62" rx="5"/><rect x="551" y="465" width="106" height="62" rx="5"/>
      <rect x="799" y="465" width="106" height="62" rx="5"/><rect x="923" y="465" width="106" height="62" rx="5"/>
    </g>
    <rect x="303" y="465" width="106" height="62" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="675" y="465" width="106" height="62" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <rect x="1047" y="465" width="106" height="62" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <g fill="#111827">
      <text x="108" y="502">block 0</text><text x="232" y="502">block 1</text><text x="356" y="502">block 2</text>
      <text x="480" y="502">block 3</text><text x="604" y="502">block 4</text><text x="728" y="502">block 5</text>
      <text x="852" y="502">block 6</text><text x="976" y="502">block 7</text><text x="1100" y="502">block 8</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow-paged)">
    <path d="M145 374 C145 420 960 415 976 463"/>
    <path d="M425 374 C425 420 360 420 356 463"/>
    <path d="M705 374 C705 420 728 420 728 463"/>
  </g>
  <text x="55" y="575" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">据 vLLM PagedAttention 官方博客与论文概念重绘；物理布局为教学示意，不等同于当前源码中的向量化张量布局。</text>
</svg>
